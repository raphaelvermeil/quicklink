# The deployed stack: everything except object storage and the queue, which come from
# AWS (see infra/). Run it with:
#
#   docker compose -f docker-compose.cloud.yml up -d --build
#
# A standalone file rather than an override of docker-compose.yml, because the
# difference is not a few settings — three services disappear (RabbitMQ, SeaweedFS and
# the bucket bootstrap), and compose overrides can add services but not remove them.
#
# Every value below comes from a .env file next to this one; see DEPLOY.md. The `:?`
# suffix makes compose refuse to start when one is missing, which is better than
# starting with an empty queue URL and failing later for a reason nobody can read.

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: quicklink
      POSTGRES_USER: quicklink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    # Every service here carries a restart policy, so a VM reboot or an Azure
    # stop/start brings the whole stack back with no one logged in. Note what makes
    # that work: Docker does not honour depends_on when it restarts containers itself,
    # so app and worker will come up before Postgres is accepting connections, die, and
    # be restarted until it is. The convergence is the point — but it does mean the
    # policy has to be on everything, or the dependency that never restarts strands the
    # ones that do.
    restart: unless-stopped
    # No published port. On a public VM, publishing 5434 would put Postgres on the
    # internet; this reaches it over the compose network instead.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quicklink"]
      interval: 2s
      timeout: 3s
      retries: 15

  redis:
    image: redis:7
    volumes: [redisdata:/data]
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: app-service/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quicklink
      SPRING_DATASOURCE_USERNAME: quicklink
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      # The public address of this deployment: it is what every short link contains.
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL in .env, e.g. http://203.0.113.10}
      SERVER_FORWARD_HEADERS_STRATEGY: framework

      # SQS instead of RabbitMQ. No broker runs anywhere in this stack.
      APP_QUEUE: sqs
      APP_SQS_QUEUE_URL: ${APP_SQS_QUEUE_URL:?}
      # Display only: lets the visualiser show DLQ depth, as it does with RabbitMQ.
      APP_SQS_DLQ_URL: ${APP_SQS_DLQ_URL:?}
      APP_SQS_REGION: ${AWS_REGION:?}
      APP_SQS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?}
      APP_SQS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?}

      # Blank endpoints are what select real AWS S3: the SDK then uses the regional
      # endpoint with virtual-host addressing, and presigned URLs are already public.
      APP_S3_ENDPOINT: ""
      APP_S3_PUBLIC_ENDPOINT: ""
      APP_S3_REGION: ${AWS_REGION:?}
      APP_S3_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?}
      APP_S3_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?}
      APP_S3_BUCKETS_ORIGINALS: ${APP_S3_BUCKETS_ORIGINALS:?}
      APP_S3_BUCKETS_PROCESSED: ${APP_S3_BUCKETS_PROCESSED:?}
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    # An instance that dies should come back rather than quietly leaving the balancer
    # with fewer backends than the diagram claims. unless-stopped, not always, so
    # `docker stop quicklink-app-2` to demo failover stays stopped.
    restart: unless-stopped
    deploy:
      replicas: 3

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/quicklink
      SPRING_DATASOURCE_USERNAME: quicklink
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:?}
      APP_QUEUE: sqs
      APP_SQS_QUEUE_URL: ${APP_SQS_QUEUE_URL:?}
      APP_SQS_DLQ_URL: ${APP_SQS_DLQ_URL:?}
      APP_SQS_REGION: ${AWS_REGION:?}
      APP_SQS_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?}
      APP_SQS_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?}
      APP_S3_ENDPOINT: ""
      APP_S3_REGION: ${AWS_REGION:?}
      APP_S3_ACCESS_KEY: ${AWS_ACCESS_KEY_ID:?}
      APP_S3_SECRET_KEY: ${AWS_SECRET_ACCESS_KEY:?}
      APP_S3_BUCKETS_ORIGINALS: ${APP_S3_BUCKETS_ORIGINALS:?}
      APP_S3_BUCKETS_PROCESSED: ${APP_S3_BUCKETS_PROCESSED:?}
    depends_on:
      postgres: { condition: service_healthy }
    # This is the one that bit: the worker exited 0 on startup and nothing noticed,
    # because an exited container looks much like a quiet one in `docker compose ps`.
    # A restarting container is visible in the status column and in `docker events`.
    restart: unless-stopped
    # Two, not three: a 2 vCPU VM has little to spare, and queue depth is the thing to
    # scale on anyway.
    deploy:
      replicas: 2

  edge-lb:
    build:
      context: .
      dockerfile: edge-lb/Dockerfile
    environment:
      EDGE_BACKENDS: quicklink-app-1:8081,quicklink-app-2:8081,quicklink-app-3:8081
      EDGE_STRATEGY: ROUND_ROBIN
    depends_on:
      app: { condition: service_started }
    # The one the outside world reaches, so it is the one whose absence looks like the
    # whole deployment being down. It health-checks its backends, so starting before
    # the app instances costs a few seconds of marking them down, not a bad state.
    restart: unless-stopped
    # Port 80, so the deployment needs no port number in its URL. The only published
    # port in the stack.
    ports: ["80:8080"]

volumes:
  pgdata: {}
  redisdata: {}
