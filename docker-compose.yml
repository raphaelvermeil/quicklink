services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: quicklink
      POSTGRES_USER: quicklink
      POSTGRES_PASSWORD: quicklink
    ports: ["5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]

  redis:
    image: redis:7
    ports: ["6380:6379"]

volumes: { pgdata: {} }




  

