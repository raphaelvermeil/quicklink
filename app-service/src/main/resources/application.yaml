server:
  port: 8081

spring:
  application:
    name: app-service
  datasource:
    url: jdbc:postgresql://localhost:5434/quicklink
    username: quicklink
    password: quicklink
  servlet:
    multipart:
      # Boot's default max-file-size is 1MB, which would reject almost any real upload.
      max-file-size: 25MB
      max-request-size: 25MB
  rabbitmq:
    host: localhost
    port: 5672
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6380

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always


app:
  base-url: http://localhost:8081
  # Which broker carries media jobs: rabbit (default) or sqs. Nothing else in the
  # application changes — MediaJobQueue has one implementation per broker, and the
  # topology beans for the unused one are never created. Override per deployment with
  # the APP_QUEUE environment variable.
  queue: rabbit
  # Only read when queue=sqs. Terraform in infra/ creates the queues and outputs these
  # URLs; unlike Rabbit, the application never declares its own topology. Leave
  # endpoint blank for real SQS, or point it at ElasticMQ to run locally.
  sqs:
    queue-url: ${APP_SQS_QUEUE_URL:}
    # Read only by the demo inspect endpoint, to report DLQ depth the way the Rabbit
    # deployment does. Nothing publishes to it.
    dlq-url: ${APP_SQS_DLQ_URL:}
    endpoint: ${APP_SQS_ENDPOINT:}
    region: ${APP_SQS_REGION:us-east-1}
    access-key: ${APP_SQS_ACCESS_KEY:}
    secret-key: ${APP_SQS_SECRET_KEY:}
  s3:
    # Leave `endpoint` SET for a local S3-compatible store. Remove it (or set it empty)
    # and the SDK talks to real AWS S3 at the regional endpoint instead — no code change.
    endpoint: http://localhost:8333
    region: us-east-1
    # Used only for presigning. A presigned URL is handed to a browser, which cannot
    # resolve the compose-internal hostname, and the signature covers the host.
    public-endpoint: http://localhost:8333
    presign-ttl: PT15M
    # SeaweedFS runs without access control, but the SDK signs every request, so
    # credentials must exist. Leave BOTH blank against real AWS and the default
    # credentials chain is used (env vars, shared profile, or an instance role) —
    # which means no long-lived secret has to live in configuration.
    access-key: quicklink
    secret-key: quicklink-secret
    buckets:
      originals: originals
      processed: processed
  rate-limit:
    capacity: 10
    window-seconds: 60