server:
  port: 8081

spring:
  application:
    name: app-service
  datasource:
    url: jdbc:postgresql://localhost:5434/quicklink
    username: quicklink
    password: quicklink
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: true
    properties:
      hibernate:
        format_sql: true
  data:
    redis:
      host: localhost
      port: 6380

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: always


app:
  base-url: http://localhost:8081
  rate-limit:
    capacity: 10
    window-seconds: 60